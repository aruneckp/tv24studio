# Render Blueprint: TV24 Studio website + AI Newsroom agent server.
# Render dashboard -> New -> Blueprint -> pick this repo
# (or copy these settings into your existing services by hand).
services:
  # 1) Agent server (FastAPI), free web service
  - type: web
    name: tv24-newsroom-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: CORS_ORIGINS
        value: https://tv24studio.onrender.com,http://localhost:5173
      # Optional free LLM editor (fill in on the dashboard)
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false

  # 2) Website (React/Vite), static site
  - type: web
    name: tv24studio
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_NEWSROOM_API
        value: https://tv24-newsroom-api.onrender.com
    routes:
      # React Router: serve index.html for /newsroom, /videos, etc.
      - type: rewrite
        source: /*
        destination: /index.html
